<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>扫地机器人智能助手</title>
  <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css" />
  <script src="/static/vendor/marked.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f0f2f5; color: #333; height: 100vh; overflow: hidden;
    }

    /* ── Layout ── */
    .app { display: flex; height: 100vh; overflow: hidden; position: relative; }

    /* ── Chat panel (left / full-width) ── */
    .chat-panel {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
      background: #fff; transition: margin-right .3s ease;
    }
    .chat-panel.drawer-open { margin-right: 0; }

    .chat-header {
      padding: 14px 24px; border-bottom: 1px solid #ebeef5;
      background: #fff; display: flex; align-items: center; gap: 10px;
    }
    .chat-header .logo { font-size: 24px; }
    .chat-header .title { font-size: 16px; font-weight: 600; flex: 1; }
    .chat-header .badge {
      font-size: 11px; background: #ecf5ff; color: #409eff; padding: 2px 8px;
      border-radius: 10px;
    }
    .chat-header .kb-btn {
      width: 34px; height: 34px; border-radius: 8px; border: 1px solid #dcdfe6;
      background: #fff; cursor: pointer; font-size: 16px; display: flex;
      align-items: center; justify-content: center; transition: .2s;
    }
    .chat-header .kb-btn:hover { background: #ecf5ff; border-color: #409eff; }
    .chat-header .kb-btn span { font-size: 11px; margin-left: 4px; }
    .chat-header .chunk-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #67c23a;
      display: inline-block; margin-right: 4px;
    }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 20px 24px;
      background: #fafbfc; display: flex; flex-direction: column; gap: 10px;
    }
    .chat-messages .welcome { text-align: center; color: #909399; margin-top: 60px; }
    .chat-messages .welcome h3 { font-size: 18px; margin-bottom: 8px; color: #606266; }
    .chat-messages .welcome p { font-size: 14px; margin-bottom: 4px; }

    /* ── Message bubbles ── */
    .msg { display: flex; gap: 10px; max-width: 85%; animation: fadeIn .2s; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot  { align-self: flex-start; }
    .msg .avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    .msg.user .avatar { background: #409eff; color: #fff; }
    .msg.bot  .avatar { background: #67c23a; color: #fff; }
    .msg .bubble {
      padding: 12px 16px; border-radius: 12px; font-size: 14px;
      line-height: 1.7; word-break: break-word;
    }
    .msg.user .bubble { background: #409eff; color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot  .bubble { background: #fff; border: 1px solid #e4e7ed; border-bottom-left-radius: 4px; }
    .msg.bot .bubble strong, .msg.bot .bubble b { color: #303133; }
    .msg.bot .bubble h4 { font-size: 15px; margin: 4px 0 6px; color: #303133; }
    .msg.bot .bubble .bot-list { margin: 4px 0 6px 18px; padding: 0; }
    .msg.bot .bubble .bot-list li { margin-bottom: 3px; line-height: 1.6; }
    .msg.bot .bubble code {
      background: #f0f2f5; padding: 1px 5px; border-radius: 3px; font-size: 13px;
    }
    .retry-btn {
      font-size: 12px; color: #909399; cursor: pointer; margin-top: 6px;
      margin-left: 46px; display: inline-block; padding: 4px 12px;
      border: 1px solid #e4e7ed; border-radius: 14px; user-select: none;
      transition: .15s;
      max-width: 95px;
    }
    .retry-btn:hover { color: #409eff; border-color: #409eff; background: #ecf5ff; }

    /* ── Typing indicator ── */
    .typing { display: none; }   /* replaced by in-bubble dots */
    .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      background: #c0c4cc; margin-right: 4px;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Chat input ── */
    .chat-input-area {
      padding: 14px 24px; border-top: 1px solid #ebeef5; background: #fff;
      display: flex; gap: 10px; align-items: center;
    }
    .chat-input-area textarea {
      flex: 1; border: 1px solid #dcdfe6; border-radius: 10px; padding: 10px 14px;
      font-size: 14px; font-family: inherit; resize: none; outline: none;
      line-height: 1.5; max-height: 120px; transition: border-color .2s;
    }
    .chat-input-area textarea:focus { border-color: #409eff; }
    .chat-input-area button {
      width: 42px; height: 42px; border-radius: 50%; border: none;
      background: #409eff; color: #fff; font-size: 18px; cursor: pointer;
      flex-shrink: 0; transition: .2s; display: flex; align-items: center; justify-content: center;
    }
    .chat-input-area button:hover { background: #66b1ff; }
    .chat-input-area button:disabled { background: #a0cfff; cursor: not-allowed; }

    /* ── Drawer overlay ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.15);
      z-index: 90; display: none; transition: opacity .3s;
    }
    .drawer-overlay.show { display: block; }

    /* ── Drawer panel (right) ── */
    .drawer {
      position: fixed; right: -400px; top: 0; bottom: 0; width: 380px;
      background: #f5f7fa; border-left: 1px solid #e4e7ed; z-index: 100;
      transition: right .3s ease; display: flex; flex-direction: column;
      overflow-y: auto; box-shadow: -4px 0 12px rgba(0,0,0,.06);
    }
    .drawer.open { right: 0; }
    .drawer-header {
      padding: 16px 18px; border-bottom: 1px solid #e4e7ed;
      display: flex; align-items: center; justify-content: space-between;
      background: #fff; position: sticky; top: 0; z-index: 1;
    }
    .drawer-header h3 { font-size: 15px; font-weight: 600; }
    .drawer-close {
      width: 30px; height: 30px; border-radius: 6px; border: none;
      background: #f0f2f5; cursor: pointer; font-size: 16px; line-height: 1;
    }
    .drawer-close:hover { background: #e4e7ed; }
    .drawer-body {
      padding: 16px 18px; display: flex; flex-direction: column; gap: 18px;
      flex: 1; overflow-y: auto;
    }

    /* Session list */
    .session-item {
      padding: 10px 12px; border-radius: 8px; background: #fff;
      border: 1px solid #e4e7ed; cursor: pointer; font-size: 14px;
      transition: .2s; margin-bottom: 8px;
    }
    .session-item:hover { background: #ecf5ff; border-color: #409eff; }
    .session-item.active { background: #ecf5ff; border-color: #409eff; }
    .session-item .s-header {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .session-item .s-title {
      color: #303133; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .session-item .s-del {
      border: none; background: transparent; color: #909399; cursor: pointer;
      font-size: 13px; padding: 2px 4px; border-radius: 4px; line-height: 1;
      opacity: 0.6; transition: .2s; flex-shrink: 0;
    }
    .session-item:hover .s-del { opacity: 1; }
    .session-item .s-del:hover { color: #f56c6c; background: #fef0f0; }
    .session-item .s-meta {
      font-size: 11px; color: #909399; margin-top: 5px; display: flex; justify-content: space-between;
    }

    /* Cards inside drawer */
    .card {
      background: #fff; border-radius: 10px; padding: 16px;
      box-shadow: 0 1px 3px rgba(0,0,0,.05);
    }
    .dropzone {
      border: 2px dashed #c0c4cc; border-radius: 8px; padding: 22px 14px;
      text-align: center; cursor: pointer; transition: .2s;
    }
    .dropzone:hover, .dropzone.dragover { border-color: #409eff; background: #ecf5ff; }
    .dropzone .dz-icon { font-size: 28px; }
    .dropzone .dz-text { color: #606266; font-size: 13px; }
    .dropzone .dz-hint { color: #c0c4cc; font-size: 11px; margin-top: 4px; }
    .dropzone input[type=file] { display: none; }

    .file-list { margin-top: 10px; }
    .file-item {
      display: flex; align-items: center; gap: 6px; padding: 6px 8px;
      border-radius: 6px; background: #f9fafc; margin-bottom: 4px; font-size: 12px;
    }
    .file-item .fname { flex: 1; word-break: break-all; }
    .file-item .fstatus { font-size: 11px; font-weight: 600; white-space: nowrap; }
    .fstatus.pending  { color: #e6a23c; }
    .fstatus.ok       { color: #67c23a; }
    .fstatus.error    { color: #f56c6c; }
    .fstatus.processing { color: #409eff; }
    .fdetail { color: #909399; font-size: 11px; margin-top: 2px; }

    .btn {
      border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px;
      cursor: pointer; transition: .2s; font-weight: 500;
    }
    .btn-primary { background: #409eff; color: #fff; }
    .btn-primary:hover { background: #66b1ff; }
    .btn-primary:disabled { background: #a0cfff; cursor: not-allowed; }
    .btn-danger { background: #f56c6c; color: #fff; }
    .btn-danger:hover { background: #f89898; }
    .btn-block { width: 100%; margin-top: 8px; }
    .actions-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }

    .stat-row { display: flex; gap: 8px; }
    .stat-item { flex: 1; background: #f9fafc; border-radius: 8px; padding: 10px; text-align: center; }
    .stat-item .num { font-size: 22px; font-weight: 700; color: #409eff; }
    .stat-item .label { font-size: 11px; color: #909399; margin-top: 2px; }

    .log-box {
      background: #1e1e1e; color: #d4d4d4; border-radius: 8px; padding: 10px;
      font-family: "Cascadia Code", Consolas, monospace; font-size: 11px;
      max-height: 220px; overflow-y: auto; line-height: 1.6;
    }
    .log-line { white-space: pre-wrap; word-break: break-all; }
    .log-line.ok { color: #67c23a; }
    .log-line.error { color: #f56c6c; }

    .collapse-toggle {
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      font-size: 13px; font-weight: 600; margin-bottom: 0; user-select: none;
    }
    .collapse-toggle .arrow { transition: .2s; font-size: 11px; }
    .collapse-toggle.open .arrow { transform: rotate(90deg); }
    .collapse-body { margin-top: 10px; }
    .collapse-body.hidden { display: none; }
  </style>
</head>
<body>
<div class="app">

  <!-- ====================  MAIN: Chat  ====================  -->
  <div class="chat-panel" id="chatPanel">
    <div class="chat-header">
      <span class="logo"><i class="fa-solid fa-robot"></i></span>
      <span class="title">扫地机器人智能助手</span>
      <span class="badge" id="modeBadge">加载中…</span>
      <button class="kb-btn" id="newChatBtn" title="新建对话"><i class="fa-solid fa-plus"></i></button>
      <button class="kb-btn" id="sessionToggle" title="历史对话"><i class="fa-solid fa-clock-rotate-left"></i></button>
      <button class="kb-btn" id="drawerToggle" title="知识库管理">
        <span class="chunk-dot" id="headerDot" style="background:#e6a23c"></span><i class="fa-solid fa-database"></i>
      </button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="welcome">
        <h3><i class="fa-solid fa-hand"></i> 你好，我是扫地机器人售后助手</h3>
        <p>可以问我使用、维护、故障排查、选购等问题</p>
        <p style="color:#c0c4cc;margin-top:8px;">示例：吸力下降怎么办 / 边刷多久换一次 / 拖地有水痕怎么解决</p>
      </div>
      <div class="typing" id="typing">
        <div class="avatar"><i class="fa-solid fa-robot"></i></div>
        <div class="bubble"><span></span><span></span><span></span></div>
      </div>
    </div>

    <div class="chat-input-area">
      <textarea id="chatInput" rows="1" placeholder="输入你的问题…" onkeydown="handleKey(event)"></textarea>
      <button id="sendBtn" onclick="handleSendBtn()" title="发送">➤</button>
    </div>
  </div>

  <!-- ====================  DRAWER: KB Management  ====================  -->
  <div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <h3><i class="fa-solid fa-database"></i> 知识库管理</h3>
      <button class="drawer-close" onclick="closeDrawer()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-body">

      <!-- Stats -->
      <div class="card">
        <div class="collapse-toggle" onclick="toggleSection('statsBody', this)">
          <span class="arrow">▶</span> 知识库状态
        </div>
        <div class="collapse-body" id="statsBody">
          <div class="stat-row">
            <div class="stat-item"><div class="num" id="statChunks">—</div><div class="label">向量分块</div></div>
            <div class="stat-item"><div class="num" id="statCollection">—</div><div class="label">集合名称</div></div>
          </div>
          <button class="btn btn-primary btn-block" onclick="refreshStats()">刷新状态</button>
        </div>
      </div>

      <!-- Upload -->
      <div class="card">
        <div class="collapse-toggle open" onclick="toggleSection('uploadBody', this)">
          <span class="arrow">▶</span> 上传文档
        </div>
        <div class="collapse-body" id="uploadBody">
          <div class="dropzone" id="dropzone">
            <div class="dz-icon"><i class="fa-solid fa-file-lines"></i></div>
            <div class="dz-text">拖拽文件到此处或点击选择</div>
            <div class="dz-hint">.txt .md .pdf .csv .docx .pptx .xlsx</div>
            <input type="file" id="fileInput" multiple
                   accept=".txt,.md,.markdown,.asciidoc,.adoc,.pdf,.csv,.docx,.doc,.pptx,.ppt,.xlsx,.xls" />
          </div>
          <div class="file-list" id="fileList"></div>
          <div class="actions-row">
            <button class="btn btn-primary" id="uploadBtn" disabled>上传</button>
            <button class="btn btn-danger" id="resetBtn">清空</button>
          </div>
        </div>
      </div>

      <!-- Log -->
      <div class="card" style="flex:1; min-height:0; display:flex; flex-direction:column;">
        <div class="collapse-toggle" onclick="toggleSection('logBody', this)">
          <span class="arrow">▶</span> 处理日志
        </div>
        <div class="collapse-body" id="logBody" style="flex:1; min-height:0;">
          <div class="log-box" id="logBox">
            <div class="log-line">就绪。</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- ====================  DRAWER: Sessions  ====================  -->
  <div class="drawer-overlay" id="sessionOverlay" onclick="closeSessions()"></div>
  <div class="drawer" id="sessionDrawer">
    <div class="drawer-header">
      <h3><i class="fa-solid fa-clock-rotate-left"></i> 历史对话</h3>
      <button class="drawer-close" onclick="closeSessions()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-body" id="sessionList">
      <div class="log-line">加载中…</div>
    </div>
  </div>

</div>

<script>
  // 生成 UUID：优先 crypto.randomUUID（secure context），否则手动生成 v4（如局域网 IP 访问）
  function genUUID() {
    if (typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function') {
      return crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  // ── 定位（查“最近网点”用）──
  // 首次调用弹授权，之后缓存；拒绝/失败静默降级（后端用城市提取兜底）
  let geoCache = null;
  let geoTried = false;
  function getGeo() {
    return new Promise((resolve) => {
      if (geoTried) return resolve(geoCache);
      if (!navigator.geolocation) { geoTried = true; return resolve(null); }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          geoCache = { lng: pos.coords.longitude, lat: pos.coords.latitude };
          geoTried = true;
          resolve(geoCache);
        },
        () => { geoTried = true; resolve(null); },
        { timeout: 5000, maximumAge: 600000 }
      );
    });
  }

  // ── Session ID ──
  // 页面加载时用 UUID 生成一次（刷新即新会话）；切换对话时更新
  let sessionId = genUUID();

  // ── Drawer ──
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('drawerOverlay');
  function openDrawer()  { drawer.classList.add('open'); overlay.classList.add('show'); }
  function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('show'); }
  document.getElementById('drawerToggle').addEventListener('click', () => {
    drawer.classList.contains('open') ? closeDrawer() : openDrawer();
  });
  // ESC to close
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

  // ── Sessions ──
  const sessionDrawer = document.getElementById('sessionDrawer');
  const sessionOverlay = document.getElementById('sessionOverlay');
  function openSessions()  { sessionDrawer.classList.add('open'); sessionOverlay.classList.add('show'); loadSessions(); }
  function closeSessions() { sessionDrawer.classList.remove('open'); sessionOverlay.classList.remove('show'); }
  document.getElementById('sessionToggle').addEventListener('click', () => {
    sessionDrawer.classList.contains('open') ? closeSessions() : openSessions();
  });
  document.getElementById('newChatBtn').addEventListener('click', newChat);

  function formatSessionTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return ts;
    const now = new Date();
    const isToday = d.toDateString() === now.toDateString();
    const pad = n => String(n).padStart(2, '0');
    const hours = pad(d.getHours());
    const mins = pad(d.getMinutes());
    if (isToday) {
      return `${hours}:${mins}`;
    }
    const yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) {
      return `昨天 ${hours}:${mins}`;
    }
    const month = pad(d.getMonth() + 1);
    const date = pad(d.getDate());
    return `${month}-${date} ${hours}:${mins}`;
  }

  async function loadSessions() {
    const list = document.getElementById('sessionList');
    try {
      const r = await fetch('/api/sessions');
      const data = await r.json();
      const sessions = data.sessions || [];
      list.innerHTML = '';
      sessions.forEach(s => {
        const item = document.createElement('div');
        item.className = 'session-item' + (s.session_id === sessionId ? ' active' : '');
        
        const header = document.createElement('div');
        header.className = 's-header';
        
        const title = document.createElement('div');
        title.className = 's-title';
        title.textContent = s.title || s.summary || '（空会话）';
        title.title = s.title || s.summary || '';
        
        const delBtn = document.createElement('button');
        delBtn.className = 's-del';
        delBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
        delBtn.title = '删除此会话';
        delBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteSessionHandler(s.session_id);
        });
        
        header.appendChild(title);
        header.appendChild(delBtn);
        
        const meta = document.createElement('div');
        meta.className = 's-meta';
        const timeStr = formatSessionTime(s.updated_at || s.ts);
        meta.innerHTML = `<span>${s.messages} 条消息</span><span>${timeStr}</span>`;
        
        item.appendChild(header);
        item.appendChild(meta);
        item.addEventListener('click', () => switchSession(s.session_id));
        list.appendChild(item);
      });
      if (!sessions.length) list.innerHTML = '<div class="log-line">暂无历史对话</div>';
    } catch (e) {
      list.innerHTML = '<div class="log-line">加载失败</div>';
    }
  }

  async function deleteSessionHandler(sid) {
    if (!confirm('确定要删除该会话吗？删除后不可恢复。')) return;
    try {
      const r = await fetch('/api/sessions/' + encodeURIComponent(sid), { method: 'DELETE' });
      const data = await r.json();
      if (data.status === 'ok') {
        if (sid === sessionId) {
          newChat();
        } else {
          loadSessions();
        }
      } else {
        alert('删除失败: ' + (data.message || '未知错误'));
      }
    } catch (e) {
      alert('删除失败，请检查网络或服务');
    }
  }

  function newChat() {
    sessionId = genUUID();
    clearChat();
    loadSessions();
  }

  function switchSession(sid) {
    sessionId = sid;
    clearChat();
    loadSessionMessages(sid);
    closeSessions();
  }

  function clearChat() {
    document.querySelectorAll('#chatMessages .msg').forEach(el => el.remove());
    welcome.style.display = 'block';
  }

  async function loadSessionMessages(sid) {
    try {
      const r = await fetch('/api/sessions/' + encodeURIComponent(sid) + '/messages');
      const data = await r.json();
      welcome.style.display = 'none';
      (data.messages || []).forEach(m => {
        appendMessage(m.role === 'user' ? 'user' : 'bot', m.content || '');
      });
    } catch (e) { /* 忽略加载失败 */ }
  }

  // ── Collapsible ──
  function toggleSection(id, toggle) {
    const body = document.getElementById(id);
    const isHidden = body.classList.toggle('hidden');
    toggle.classList.toggle('open', !isHidden);
  }

  // ── KB Upload ──
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const uploadBtn = document.getElementById('uploadBtn');
  const resetBtn = document.getElementById('resetBtn');
  const logBox = document.getElementById('logBox');
  let pendingFiles = [];

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault(); dropzone.classList.remove('dragover');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', e => handleFiles(e.target.files));

  function handleFiles(files) {
    for (const f of files) pendingFiles.push({ file: f, status: 'pending', detail: '' });
    renderFileList();
    uploadBtn.disabled = pendingFiles.length === 0;
    openDrawer();
  }
  function renderFileList() {
    fileList.innerHTML = pendingFiles.map(item => {
      const f = item.file, s = (f.size/1024).toFixed(1);
      return `<div class="file-item">
        <span class="fname">${h(f.name)}</span>
        <span class="fstatus ${item.status}">${st(item.status)}</span>
        ${item.detail ? `<div class="fdetail">${h(item.detail)}</div>` : ''}
      </div>`;
    }).join('');
  }
  function st(s) { return { pending:'待上传', processing:'处理中', ok:'成功', error:'失败' }[s]||s; }
  function h(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function klog(msg, type='info') {
    const line=document.createElement('div'); line.className='log-line '+type;
    const t=new Date().toLocaleTimeString(); line.textContent=`[${t}] ${msg}`;
    logBox.appendChild(line); logBox.scrollTop=logBox.scrollHeight;
  }

  uploadBtn.addEventListener('click', async () => {
    uploadBtn.disabled = true; resetBtn.disabled = true;
    for (const item of pendingFiles) {
      if (item.status === 'ok') continue;
      item.status = 'processing'; renderFileList();
      const fd = new FormData(); fd.append('file', item.file);
      klog(`上传 ${item.file.name}…`);
      try {
        const r = await fetch('/api/ingest', { method:'POST', body:fd });
        const d = await r.json();
        if (d.status === 'ok') {
          item.status='ok'; item.detail=`${d.chunks} chunks · ${d.elapsed}s`;
          klog(`✅ ${d.file} → ${d.chunks} chunks`, 'ok');
        } else {
          item.status='error'; item.detail=d.message||'';
          klog(`❌ ${item.file.name}: ${d.message}`, 'error');
        }
      } catch(err) {
        item.status='error'; item.detail=String(err);
        klog(`❌ ${item.file.name}: ${err}`, 'error');
      }
      renderFileList();
    }
    await loadStats();
    uploadBtn.disabled = false; resetBtn.disabled = false;
    pendingFiles = pendingFiles.filter(f => f.status !== 'ok');
    renderFileList();
  });

  resetBtn.addEventListener('click', async () => {
    if (!confirm('确定清空知识库？不可撤销。')) return;
    klog('清空中…');
    try {
      const r = await fetch('/api/reset', { method:'POST' });
      const d = await r.json();
      klog(`✅ 已清除 ${d.deleted} chunks`, 'ok');
      await loadStats();
    } catch(err) { klog(`❌ ${err}`, 'error'); }
  });

  async function loadStats() {
    try {
      const r = await fetch('/api/stats');
      const d = await r.json();
      document.getElementById('statChunks').textContent = d.chunk_count ?? '—';
      document.getElementById('statCollection').textContent = d.collection_name ?? '—';
      const color = (d.chunk_count||0) > 0 ? '#67c23a' : '#e6a23c';
      document.getElementById('statChunks').style.color = color;
      document.getElementById('headerDot').style.background = color;
    } catch(err) { klog(`状态获取失败: ${err}`, 'error'); }
  }

  function refreshStats() { loadStats(); klog('状态已刷新', 'ok'); }

  // ── Chat ──
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const typing = document.getElementById('typing');
  const welcome = chatMessages.querySelector('.welcome');
  let isStreaming = false;   // 是否正在流式回答（阻止按钮 + enter 重复发送）

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }
  chatInput.addEventListener('input', () => {
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
  });

  async function streamAnswer(query, botDiv, bubble, retry) {
    // Show loading dots, clear previous content
    bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    if (retry) retry.style.display = 'none';
    scrollBottom();

    let streamedText = '';
    let stoppedByUser = false;

    try {
      // 查网点时尝试获取定位（授权一次后缓存），失败静默降级到城市提取
      const needGeo = /网点|门店|服务点|维修点|售后点|授权店|服务站/.test(query);
      let lng = null, lat = null;
      if (needGeo) {
        const geo = await getGeo();
        if (geo) { lng = geo.lng; lat = geo.lat; }
      }
      const r = await fetch('/api/chat/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, session_id: sessionId, lng, lat })
      });

      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split('\n\n');
        buffer = parts.pop();
        for (const part of parts) {
          if (part.startsWith('data: ')) {
            const payload = part.slice(6);
            if (payload === '[DONE]') continue;
            if (payload === '[STOPPED]') { stoppedByUser = true; break; }
            let chunk;
            try { chunk = JSON.parse(payload); } catch { chunk = payload; }
            streamedText += chunk;
            bubble.innerHTML = md(streamedText);
            scrollBottom();
          }
        }
        if (stoppedByUser) break;
      }

      if (stoppedByUser) {
        bubble.innerHTML = md(streamedText + '\n\n（已停止）');
        scrollBottom();
      }
    } catch (err) {
      bubble.innerHTML = md('抱歉，连接失败，请检查服务是否启动。');
    }

    if (retry) retry.style.display = '';
  }

  function setSendBtn(streaming) {
    sendBtn.innerHTML = streaming ? '■' : '➤';
    sendBtn.title = streaming ? '停止回答' : '发送';
    sendBtn.disabled = false;
  }

  function stopAnswer() {
    fetch('/api/chat/stop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId })
    });
  }

  function handleSendBtn() {
    if (isStreaming) {
      stopAnswer();
    } else {
      sendMessage();
    }
  }

  async function sendMessage() {
    if (isStreaming) return;   // 正在回答，忽略新消息（按钮 + enter 双保险）
    const query = chatInput.value.trim();
    if (!query) return;
    if (welcome) welcome.remove();
    // 移除之前所有"重新回答"按钮，只保留最新一条
    document.querySelectorAll('.retry-btn').forEach(el => el.remove());
    appendMessage('user', query);
    chatInput.value = '';
    chatInput.style.height = 'auto';
    isStreaming = true;
    setSendBtn(true);

    // Create bot bubble with loading dots
    const botDiv = document.createElement('div');
    botDiv.className = 'msg bot';
    botDiv.innerHTML = '<div class="avatar"><i class="fa-solid fa-robot"></i></div><div class="bubble"></div>';
    chatMessages.insertBefore(botDiv, typing);
    const bubble = botDiv.querySelector('.bubble');

    // Retry button below the bubble
    const retry = document.createElement('div');
    retry.className = 'retry-btn';
    retry.innerHTML = '<i class="fa-solid fa-rotate-right"></i> 重新回答';
    retry.title = '使用相同问题重新回答';
    retry.addEventListener('click', () => streamAnswer(query, botDiv, bubble, retry));
    botDiv.after(retry);

    try {
      await streamAnswer(query, botDiv, bubble, retry);
      loadSessions();
    } finally {
      isStreaming = false;
      setSendBtn(false);
      chatInput.focus();
    }
  }

  function appendMessage(role, text) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    const av = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-robot"></i>';
    div.innerHTML = `<div class="avatar">${av}</div><div class="bubble">${md(text)}</div>`;
    chatMessages.insertBefore(div, typing);
    scrollBottom();
    div.addEventListener('click', () => { if (role === 'bot') chatInput.focus(); });
  }

  // 用 marked 渲染 markdown（本地 vendor），渲染前转义 < > 防 XSS
  if (typeof marked !== 'undefined') {
    marked.setOptions({ breaks: true, gfm: true });
  }

  function md(text) {
    if (typeof marked === 'undefined') {
      // 回退：无 marked 时按行转义输出
      return text.split('\n').map(l => h(l)).join('<br>');
    }
    const escaped = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return marked.parse(escaped);
  }

  function scrollBottom() {
    setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; }, 50);
  }

  // Init
  loadStats();
  loadConfig();

  async function loadConfig() {
    try {
      const r = await fetch('/api/config');
      const d = await r.json();
      if (d.status === 'ok') {
        const badge = document.getElementById('modeBadge');
        badge.textContent = `${d.mode_label}`;
        badge.title = `模型: ${d.model}`;
      }
    } catch(e) { document.getElementById('modeBadge').textContent = 'RAG'; }
  }
</script>
</body>
</html>
