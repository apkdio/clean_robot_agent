# 上下文承接与查询改写配置模板
# 使用方式：复制本文件为 config/context.yaml 即可，无需额外改动。
#
# 对应设计：notes/OPTIMIZATION_ROADMAP.md 的「P0-3 详细设计」。
# 背景一句话：追问句（"那这个电流现象影响大吗"）的指代在上文，单看无信号会被
# 意图分类头误判成领域外；这里配置"判不了"的判定阈值与读上文的策略。

intent:
  # other 意图的 margin（top1 - top2 概率差）低于本值 → 认为分类头拿不准。
  # 拿不准**且上文有可承接话题**时才不硬拒答（低置信是入场券，不是放行证）。
  # 实测：可承接的追问 margin ≈ 0.014，真域外 "那你们有飞机卖吗" ≈ 0.096，
  #       明确的域外 "有没有飞机卖" ≈ 0.670 → 0.2 有充足余量。
  # 置 0 关闭该降级（回到"一律拒答"的旧行为）。
  low_conf_margin: 0.2

context:
  # 总开关：关闭后不承接、不改写
  enabled: true
  # 回看最近多少条会话记录（消息数，非轮数），用于判定：
  #   ① 近期是否发生过安全告警（danger 标记）② 上文聊的是不是机器人话题（域命中）
  # 注意会话内存缓存上限是 12 条（6 轮），超过不会生效。
  topic_window: 8

  rewrite:
    # 改写总开关
    enabled: true
    # rule      —— 只用规则改写（把余弦选中的历史轮拼到当前 query 前），零额外推理
    # rule+llm  —— 规则挑不出相关历史轮时，再用小模型（agent.yaml 的 small_model）改写
    # 两者在效果上的差异需要在多轮评测集上对比（见路线图 P0-3 §6），不预设结论。
    mode: rule
    # 改写结果长度上限：超出即判为无效并回退原 query
    max_chars: 80
    # 只考虑相似度最高的前几轮（宁缺毋滥：拼多了会把当前 query 的语义淹掉）
    max_history_turns: 2
    # 相似度下限：低于此值的历史轮不参与改写。
    #
    # 2026-09-21 实测（bge-m3 裸余弦，query = "那这个电流现象影响大吗"）：
    #   它好像有点漏电，电池滋滋的在响（真指代对象） 0.584  ← 要选中的
    #   今天天气怎么样（完全无关）                    0.531
    #   它之前拖地的效果突然就变差了（相邻轮）         0.523
    #   我要维修                                      0.521
    #   边刷多久换一次                                0.468
    #   扫地机器人怎么连接APP                         0.343
    #
    # 注意：区分度只有 0.24，且“完全无关”的天气句能排到第二 → 绝对阈值选轮本身
    # 很脆弱，所以取严（0.55）+ 只取 top-2，并且原 query 永远保留、0 命中会回退重检。
    min_similarity: 0.55
    #
    # 说明：原计划里的 keep_recent（强制保留最近一轮）已去掉——实测相邻轮
    # （0.523）并不比完全无关的（0.531）更相关，强行保留只会引入噪声。
    # 最近一轮在自然排序里本就会参与，过不了阈值就不该拼进来。
    # 改写后检索 0 命中 → 用原 query 再检一次
    retry_with_origin: true
