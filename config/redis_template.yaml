# Redis 连接配置（复制本文件为 redis.yaml 后填值）
host: localhost
port: 6379
password: <YOUR_REDIS_PASSWORD>
db: 0
# 业务 key TTL（秒）
# sop_ttl 是**滑动**过期：每轮写会话状态都会重盖，语义是"空闲这么久就作废"，
# 不是"从进流程开始算最多这么久"。客服场景按 15 分钟空闲收敛。
sop_ttl: 900       # SOP 会话状态 15 分钟
lock_ttl: 60       # 并发锁 / 摄入锁 60 秒
# 待确认状态（进入/退出确认门）。必须 >= sop_ttl：pending 先过期而 SOP 还活着时，
# 用户答「是」会被当成槽位输入（既不退出也不再确认），用户无法理解。
# 代码里默认值直接取 sop_ttl，不再各自写死。
pending_ttl: 900
