# Agent configuration
# 使用方式：复制本文件为 agent.yaml，然后填入你的实际参数。

# LLM 设置（OpenAI 兼容端点，默认连接本地 Ollama）
llm:
  model: <YOUR_MODEL_NAME>        # 主生成模型：Ollama 模型名，如 qwen2.5:7b / qwen3:8b / llama3.1:8b
  small_model: <YOUR_SMALL_MODEL> # 轻量兜底模型（预算/故障分类/会话标题），如 qwen2.5:3b
  base_url: <OLLAMA_BASE_URL>     # 本地 Ollama 默认地址；云端服务改为对应 API 地址
  api_key: ollama                       # 本地 Ollama 无需真实 key；云端服务填入实际 API Key
  temperature: 0.3
  max_tokens: 1024

# 行为开关
behavior:
  retrieval_only: true           # true=直接返回检索片段原文（小模型推荐）；false=走 LLM 生成
  verbose_log: false             # true=文件日志降到 DEBUG（召回详情/top-N 命中内容）；环境变量 LOG_LEVEL 优先级更高
  query_normalize: true          # true=query 入口归一化（标点/空格/全半角/同义词）+ 判可疑时用原文二次判意图；false=完全按原文走

# 操作判别打分（关键句做稠密 + BM25 双路打分，强判据加分）
# scoring："off"=不算分（回到纯 bool 表序）；"shadow"=算分并落 trace，派发仍按表序；"on"=按分派发
# 取值必须带引号：YAML 会把裸 off / on 当成布尔
operations:
  scoring: "on"
  floor: 1.20            # 分数下限（0~2.5 量纲）；实测正确项最低 1.80、干扰项中位 1.30
  gap: 0.10              # 前两名分差小于它 → 判 ambiguous，问用户选 1/2
                         # 实测：28 条里只有 1 条（0.04）触发；知识类多候选分差 ≥0.79